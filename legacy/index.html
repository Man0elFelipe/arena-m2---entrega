<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste Codex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg-1: #f5efe6;
      --bg-2: #dce8ff;
      --panel: rgba(255, 255, 255, 0.72);
      --panel-border: rgba(255, 255, 255, 0.55);
      --text: #162033;
      --muted: #5f6c82;
      --accent: #0f766e;
      --accent-strong: #0b5d57;
      --shadow: 0 24px 80px rgba(22, 32, 51, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.92), transparent 32%),
        radial-gradient(circle at bottom right, rgba(15, 118, 110, 0.18), transparent 30%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    main {
      position: relative;
      text-align: center;
      width: min(100%, 560px);
      padding: 48px 32px;
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    main::before {
      content: "";
      position: absolute;
      inset: -30% auto auto -10%;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(15, 118, 110, 0.12);
      filter: blur(8px);
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      display: inline-block;
      margin: 0 0 16px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(36px, 6vw, 56px);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    p {
      position: relative;
      z-index: 1;
      margin: 18px auto 0;
      max-width: 34ch;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    button {
      position: relative;
      z-index: 1;
      margin-top: 28px;
      padding: 14px 22px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), #169c91);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(15, 118, 110, 0.28);
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(15, 118, 110, 0.32);
      filter: saturate(1.05);
    }

    button:active {
      transform: translateY(0);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
    }

    .status::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.12);
    }

    @media (max-width: 480px) {
      main {
        padding: 40px 24px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Experimento UI</span>
    <h1>Teste Codex</h1>
    <p id="mensagem">Uma interface simples, limpa e atual para validar interacoes rapidas no navegador.</p>
    <button type="button" id="trocar-texto">Mudar texto</button>
    <div class="status">Pronto para interagir</div>
  </main>

  <script>
    const botao = document.getElementById("trocar-texto");
    const mensagem = document.getElementById("mensagem");

    botao.addEventListener("click", () => {
      mensagem.textContent = "O texto foi alterado com sucesso.";
    });
  </script>
</body>
</html>
