<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena+ | Busca</title>
    <link rel="icon" href="img/logo-arena.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<main class="pagina">
    <div class="titulo-pagina"><div><h1>Buscar</h1><p>Encontre atletas, esportes e comunidades.</p></div></div>
    <form class="busca busca-pagina" id="form-busca" role="search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <label for="q" class="sr-only">Termo de busca</label>
        <input id="q" name="q" type="search" placeholder="Ex.: vôlei, Campinas, Lucas..." autocomplete="off">
    </form>
    <section aria-labelledby="t-pessoas" class="secao-busca">
        <h2 id="t-pessoas" class="card-titulo"><i class="fa-solid fa-user-group" aria-hidden="true"></i> Pessoas <span class="chip" id="n-pessoas"></span></h2>
        <div id="res-pessoas" class="grade-pessoas" aria-live="polite"></div>
    </section>
    <section aria-labelledby="t-comunidades" class="secao-busca">
        <h2 id="t-comunidades" class="card-titulo"><i class="fa-solid fa-people-group" aria-hidden="true"></i> Comunidades <span class="chip" id="n-comunidades"></span></h2>
        <div id="res-comunidades" class="grade-comunidades" aria-live="polite"></div>
    </section>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/session.js"></script>
<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script src="js/pages/busca.js"></script>
</body>
</html>
