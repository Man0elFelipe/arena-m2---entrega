# Testes usam H2 em memória para não tocar no banco de arquivo
spring.datasource.url=jdbc:h2:mem:arenaplus-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
arenaplus.seed.enabled=false
arenaplus.cors.allowed-origins=http://localhost:3000
arenaplus.upload.dir=./target/uploads-teste
arenaplus.rate-limit.geral-por-minuto=100000
arenaplus.rate-limit.auth-por-minuto=100000
arenaplus.coach.api-key=
arenaplus.coach.limite-por-hora=5
