spring.application.name=arenaplus-api
server.port=8080

# Perfil padrão: local (habilita console H2 e dados de demonstração)
spring.profiles.default=local

# H2 em arquivo: os dados ficam em backend-java/data/arenaplusdb.mv.db
spring.datasource.url=jdbc:h2:file:./data/arenaplusdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ddl-auto=update somente para ambiente acadêmico/desenvolvimento
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Console H2 desligado por padrão; o perfil local liga
spring.h2.console.enabled=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# CORS: origens do frontend local
arenaplus.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500

# Popular dados de demonstração quando o banco estiver vazio
arenaplus.seed.enabled=false

# Autenticação e limites de requisição
arenaplus.auth.token-dias=7
arenaplus.rate-limit.geral-por-minuto=600
arenaplus.rate-limit.auth-por-minuto=20

# Upload de mídia: arquivos em disco (fora do H2), caminho configurável
arenaplus.upload.dir=./data/uploads
arenaplus.upload.max-imagem-mb=10
arenaplus.upload.max-video-mb=50
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

# Arena Coach (IA). A chave NUNCA fica neste arquivo: vem do ambiente (ARENAPLUS_COACH_API_KEY, ou OPENAI_API_KEY)
# ou do arquivo .env na raiz do projeto, que o iniciar.sh carrega e que não é versionado (veja .env.example).
arenaplus.coach.api-key=${ARENAPLUS_COACH_API_KEY:${OPENAI_API_KEY:}}
arenaplus.coach.base-url=${ARENAPLUS_COACH_BASE_URL:https://api.openai.com/v1}
arenaplus.coach.model=${ARENAPLUS_COACH_MODEL:${OPENAI_MODEL:gpt-4o-mini}}
arenaplus.coach.timeout-segundos=30
arenaplus.coach.max-chars-mensagem=1000
arenaplus.coach.limite-por-minuto=6
arenaplus.coach.limite-por-hora=30

server.error.include-stacktrace=never
