spring.application.name=arenaplus-api
server.port=8080

# Perfil padrão: local (habilita console H2 e dados de demonstração)
spring.profiles.default=local

# H2 em arquivo: os dados ficam em backend-java/data/arenaplusdb.mv.db
spring.datasource.url=jdbc:h2:file:./data/arenaplusdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ddl-auto=update somente para ambiente acadêmico/desenvolvimento
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Console H2 desligado por padrão; o perfil local liga
spring.h2.console.enabled=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# CORS: origens do frontend local
arenaplus.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500

# Popular dados de demonstração quando o banco estiver vazio
arenaplus.seed.enabled=false

server.error.include-stacktrace=never
